<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<link rel="stylesheet" href="/public/css/icons.css">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0b1020;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  .c{max-width:360px}
  h1{font-size:20px;margin:16px 0 6px}
  p{color:#94a3b8;font-size:14px;margin:0}
  button{margin-top:20px;padding:11px 20px;border-radius:12px;border:0;background:#4f8cff;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <i class="fa-solid fa-cloud icon" style="font-size:56px;line-height:1;opacity:.75" aria-hidden="true"></i>
  <h1>You are offline</h1>
  <p>Reconnect to the internet to see your files.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
