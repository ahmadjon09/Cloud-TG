<!DOCTYPE html>
<html lang="{{LANG}}">

<head>
<script>
  // Build guard: if this HTML's build differs from the one we last ran, reload
  // once so stale cached JS (old icons/el code) can never keep rendering.
  (function () {
    try {
      var b = "{{BUILD}}";
      var prev = localStorage.getItem("cloud-build");
      if (prev && prev !== b && sessionStorage.getItem("cloud-build-reloaded") !== b) {
        sessionStorage.setItem("cloud-build-reloaded", b);
        localStorage.setItem("cloud-build", b);
        location.reload();
      }
      localStorage.setItem("cloud-build", b);
    } catch (e) {}
  })();
</script>

  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="description" content="Cloud — your personal cloud storage inside Telegram">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Cloud</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/public/css/tokens.css?v={{BUILD}}">
  <link rel="stylesheet" href="/public/css/icons.css?v={{BUILD}}">
  <link rel="stylesheet" href="/public/css/app.css?v={{BUILD}}">
  <link rel="preload" href="/public/fonts/fa-solid-900.woff2?v={{BUILD}}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png?v={{BUILD}}">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/icons/favicon-16.png?v={{BUILD}}">
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png?v={{BUILD}}">
</head>

<body>
  <div class="app" id="app">
    <!-- ───────────────────────── sidebar (desktop + drawer) ─────────────── -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <div class="grow">
          <div class="brand-name" data-i18n="app.name">Cloud</div>
          <div class="brand-sub" data-i18n="app.subtitle">Your personal cloud storage</div>
        </div>
        <button class="icon-btn" id="sidebarClose" data-i18n-title="nav.closeMenu" aria-label="Close menu"></button>
      </div>
      <nav class="nav" id="navList"></nav>
      <div class="sidebar-foot">
        <div class="storage-card" id="storageCard"></div>
        <div class="user-card" id="userCard"></div>
      </div>
    </aside>

    <!-- ───────────────────────── main ───────────────────────── -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" data-i18n-title="nav.openMenu" aria-label="Open menu"></button>
        <div class="topbar-title truncate" id="viewTitle" data-i18n="nav.all">All files</div>

        <div class="search-wrap" id="searchWrap">
          <span id="searchIcon"></span>
          <input class="search-input" id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
            data-i18n-placeholder="action.searchFiles" placeholder="Search by name…">
          <button class="search-clear hidden" id="searchClear" aria-label="Clear"></button>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" data-i18n-title="action.refresh" aria-label="Refresh"></button>
          <button class="icon-btn" id="viewBtn" data-i18n-title="action.sort" aria-label="View"></button>
          <button class="icon-btn" id="fullscreenBtn" data-i18n-title="action.fullscreen" aria-label="Full screen"></button>
          <button class="icon-btn" id="moreBtn" data-i18n-title="action.more" aria-label="More"></button>
        </div>
      </header>

      <div class="chips" id="chips"></div>

      <div class="toolbar" id="toolbar">
        <div class="grow">
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="row" id="toolbarActions"></div>
      </div>

      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <button class="fab hidden" id="fab" aria-label="Menu"></button>

  <script id="boot" type="application/json">{{BOOT}}</script>
  <script type="module" src="/public/js/app.js?v={{BUILD}}"></script>
</body>

</html>
