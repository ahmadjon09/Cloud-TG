<!DOCTYPE html>
<html lang="{{LANG}}">

<head>
<script>
  // Build guard: if this HTML's build differs from the one we last ran, reload
  // once so stale cached JS (old icons/el code) can never keep rendering.
  (function () {
    try {
      var b = "{{BUILD}}";
      var prev = localStorage.getItem("cloud-build");
      if (prev && prev !== b && sessionStorage.getItem("cloud-build-reloaded") !== b) {
        sessionStorage.setItem("cloud-build-reloaded", b);
        localStorage.setItem("cloud-build", b);
        location.reload();
      }
      localStorage.setItem("cloud-build", b);
    } catch (e) {}
  })();
</script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <title>Cloud · Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/public/css/tokens.css?v={{BUILD}}">
  <link rel="stylesheet" href="/public/css/icons.css?v={{BUILD}}">
  <link rel="stylesheet" href="/public/css/admin.css?v={{BUILD}}">
  <link rel="preload" href="/public/fonts/fa-solid-900.woff2?v={{BUILD}}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32.png?v={{BUILD}}">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/icons/favicon-16.png?v={{BUILD}}">
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png?v={{BUILD}}">
</head>

<body>
  <div class="admin">
    <header class="admin-top">
      <div class="row">
        <span class="admin-mark" id="adminMark"></span>
        <div>
          <div class="admin-title" data-i18n="admin.title">Admin panel</div>
          <div class="admin-sub" data-i18n="admin.subtitle">Manage users, files and announcements</div>
        </div>
      </div>
      <div class="admin-top-actions">
        <button class="icon-btn" id="refreshBtn" data-i18n-title="admin.refreshData" aria-label="Refresh"></button>
        <button class="icon-btn" id="backBtn" data-i18n-title="admin.backToApp" aria-label="Back to app"></button>
        <button class="icon-btn" id="moreBtn" data-i18n-title="action.more" aria-label="More"></button>
      </div>
    </header>

    <nav class="admin-tabs" id="tabs"></nav>

    <main class="admin-main" id="main">
      <div class="center-spinner"><span class="spinner spinner-lg"></span></div>
    </main>
  </div>

  <div class="toast-host" id="toastHost"></div>

  <script id="boot" type="application/json">{{BOOT}}</script>
  <script type="module" src="/public/js/admin.js?v={{BUILD}}"></script>
</body>

</html>
